[project]
name = "expense-voucher-assistant"
version = "0.2.4"
description = "核銷憑證辨識與建檔助手：本機 Python + Vertex AI + Google Drive / Google Sheets 自動化管線"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "openai>=1.66.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "pymupdf>=1.24.0",
    "Pillow>=10.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
